<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700">
<style>
@keyframes materialize {
  0%   { opacity: 0; }
  100% { opacity: 1; }
}
.rowline {
  opacity: 0;
  animation: materialize 0.5s ease-out forwards;
}
.caption {
  opacity: 0;
  animation: materialize 0.8s ease-out forwards;
  animation-delay: 1.15s;
}
@media (prefers-reduced-motion: reduce) {
  .rowline, .caption { animation: none; opacity: 1; }
}
</style>
